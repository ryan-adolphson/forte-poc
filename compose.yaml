name: forte-search

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: forte
      POSTGRES_PASSWORD: forte
      POSTGRES_DB: forte_search
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forte -d forte_search"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
