<mat-sidenav-container>
  <!-- In "over" mode Material traps focus in the panel, closes it on Escape or a click outside,
       and returns focus to the button that opened it. -->
  <mat-sidenav
    mode="over"
    position="end"
    autoFocus="textarea"
    role="dialog"
    aria-modal="true"
    aria-label="Ask Forte"
  >
    <app-chat-panel (closed)="panel().close()" />
  </mat-sidenav>

  <mat-sidenav-content>
    <header>
      <mat-toolbar>
        <h1>Forte</h1>
        <span class="spacer"></span>
        <button matButton="filled" type="button" (click)="ask(null)">Ask Forte</button>
      </mat-toolbar>
    </header>

    <main>
      <p class="intro">
        Construction materials with their tested properties. Browse the catalogue, or ask Forte
        about any product.
      </p>
      <app-catalogue (ask)="ask($event)" />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
