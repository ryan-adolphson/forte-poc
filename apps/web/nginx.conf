# Serves the built Angular app and proxies /api/ to the api service.
# Installed as /etc/nginx/conf.d/default.conf by apps/web/Dockerfile.

server {
  listen 8080;
  root /usr/share/nginx/html;

  # Static text only. text/event-stream is not listed, and /api/ turns gzip off as well.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Docker's DNS, asked again every 10s, so a recreated api container is found
  # without restarting nginx. The variable is what makes nginx resolve at request time.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The chat answer is a server-sent event stream: pass each event on as it
    # arrives, and allow a slow answer to take a while between events.
    proxy_buffering off;
    proxy_read_timeout 300s;
    gzip off;
  }

  # Files with a content hash in the name never change.
  location ~ "-[A-Z0-9]{8}\.[a-z0-9]+$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always revalidate, so a new build is picked up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: any other path is handled by the Angular router.
  location / {
    try_files $uri /index.html;
  }
}
